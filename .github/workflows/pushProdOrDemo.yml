name: Push on branch demo or prod

on:
  push:
    branches:
      - prod
      - demo

jobs:

  checkBackend: 
    name: Backend
    uses: ./.github/workflows/backend.yml

  checkEtl: 
    name: Etl
    uses: ./.github/workflows/etl.yml
    secrets:
      DATA_REPOSITORY: "${{ secrets.DATA_REPOSITORY }}"

  checkSuggestions: 
    name: Suggestions
    uses: ./.github/workflows/suggestions.yml
    secrets:
      DATA_REPOSITORY: "${{ secrets.DATA_REPOSITORY }}"
      
  checkSuggestions2: 
    name: Suggestions2
    uses: ./.github/workflows/suggestions2.yml
      
  pushToOnisep: 
    name: ONISEP Repository
    needs: [checkBackend, checkEtl, checkSuggestions, checkSuggestions2]
    uses: ./.github/workflows/onisep.yml
    secrets:
      GITLAB_ONISEP_SSH_KEY: "${{ secrets.GITLAB_ONISEP_SSH_KEY }}"