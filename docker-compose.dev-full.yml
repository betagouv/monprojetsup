services:

  appdb:
    image: postgres:15.8
    restart: always
    environment:
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      PGPORT: ${APP_DB_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${APP_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - ${APP_DB_PORT_EXPOSED}:${APP_DB_PORT}
    volumes:
      - ./test-db/db:/var/lib/postgresql/data
      - ./test-db/init-scripts:/docker-entrypoint-initdb.d

  suggestions2:
    depends_on:
      appdb:
        condition: service_healthy
    build:
      context: ./app/suggestions2
      dockerfile: Dockerfile
    ports:
      - ${SUGGESTIONS2_PORT_EXPOSED}:${SUGGESTIONS2_PORT}
    environment:
      DB_SUGGESTIONS2_PORT: ${APP_DB_PORT}
      DB_SUGGESTIONS2_NAME:  ${APP_DB_NAME}
      DB_SUGGESTIONS2_USERNAME: ${APP_DB_USER}
      DB_SUGGESTIONS2_PASSWORD: ${APP_DB_PASSWORD}
      DB_SUGGESTIONS2_HOSTNAME: appdb
      SUGGESTIONS2_ENDPOINT_PORT: ${SUGGESTIONS2_PORT}

  suggestions:
    depends_on:
      appdb:
        condition: service_healthy
      suggestions2:
        condition: service_started
    build:
      context: ./app
      dockerfile: suggestions/docker/Dockerfile
    ports:
      - ${SUGGESTIONS_PORT_EXPOSED}:${SUGGESTIONS_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SUGGESTIONS_PORT}/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      SUGGESTIONS_SERVER_PORT: ${SUGGESTIONS_PORT}
      DB_URL: jdbc:postgresql://appdb:${APP_DB_PORT}/${APP_DB_NAME}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      FRONT_URI: http://localhost:${FRONT_PORT_EXPOSED}
      SUGGESTIONS_SWAGGER_URL: http://localhost:${SUGGESTIONS_PORT}
      SUGGESTIONS2_URL: http://suggestions2:${SUGGESTIONS2_PORT}
      SUGGESTIONS2_ENABLED: false
      GENERATE_DETAILED_EXPLANATIONS: true
      ENABLE_DYNAMIC_PARAMETERS_SERVICE: true

  keycloakdb:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PGPORT: ${KEYCLOAK_DB_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./keycloak/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./keycloak/db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    depends_on:
      keycloakdb:
        condition: service_healthy
    ports:
      - ${KEYCLOAK_PORT_EXPOSED}:${KEYCLOAK_PORT}
    environment:
      KC_DB: ${KEYCLOAK_DB_NAME}
      KC_DB_URL: jdbc:postgresql://keycloakdb:${KEYCLOAK_DB_PORT}/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_LOGLEVEL: DEBUG
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HEALTH_ENABLED: true
    restart: always
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/health/live'
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    entrypoint: /opt/keycloak/bin/kc.sh start-dev

  back:
    depends_on:
      appdb:
        condition: service_healthy
      suggestions:
        condition: service_healthy
    build:
      context: ./app/back
      dockerfile: docker/Dockerfile.dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACK_PORT}/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    ports:
      - ${BACK_PORT_EXPOSED}:${BACK_PORT}
    environment:
      SERVER_PORT: ${BACK_PORT}
      DB_URL: jdbc:postgresql://appdb:${APP_DB_PORT}/${APP_DB_NAME}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SUGGESTIONS_API_URL: http://suggestions:${SUGGESTIONS_PORT}/api/1.2
      CORS_ORIGINPATTERNS: ${BACK_CORS_ORIGINPATTERNS}
      KEYCLOAK_CLIENT_ID: mps-cli
      KEYCLOAK_CLIENT_SECRET: anfoYhY7PNxIhgEthcWdbq2P4XPJ90Aw
      KEYCLOAK_ROYAUME_URL: ${LOCALHOST_ACCESS}:${KEYCLOAK_PORT_EXPOSED}/realms/avenirs
      KEYCLOAK_ROYAUME_URL_JWT_VERIF: ${LOCALHOST_ACCESS}:${KEYCLOAK_PORT_EXPOSED}/realms/avenirs
      KEYCLOAK_PORT: ${KEYCLOAK_PORT_EXPOSED}
      PARCOURSUP_API_CLIENT_ID: local
      PARCOURSUP_API_CLIENT_PASSWORD: password
      PARCOURSUP_URL_AUTHENT: https://authentification.parcoursup.fr
      PARCOURSUP_AUTHENT_CLIENT_ID: client_id
      PARCOURSUP_AUTHENT_CLIENT_PASSWORD: client_password
      PARCOURSUP_API_URL: https://favoris.parcoursup.fr
      LOG_LEVEL: DEBUG
    extra_hosts:
      - host.docker.internal:host-gateway

  front:
    depends_on:
      back:
        condition: service_healthy
    build:
      context: ./app/front
      dockerfile: docker/Dockerfile.dev
    ports:
      - ${FRONT_PORT_EXPOSED}:5001
    environment:
      VITE_ENV: local
      VITE_APP_URL: ${LOCALHOST_ACCESS}:${FRONT_PORT_EXPOSED}
      VITE_API_URL: ${LOCALHOST_ACCESS}:${BACK_PORT_EXPOSED}
      VITE_ALLOWED_HOST: ${VITE_ALLOWED_HOST}
      VITE_PUBLIC_WEBSITE_URL: https://www.monprojetsup.fr
      VITE_AVENIRS_URL: https://avenirs.onisep.fr
      VITE_MATOMO_URL: http://urldetrackingmatomo.org
      VITE_KEYCLOAK_URL: ${LOCALHOST_ACCESS}:${KEYCLOAK_PORT_EXPOSED}
      VITE_KEYCLOAK_ROYAUME: avenirs
      VITE_KEYCLOAK_CLIENT_ID: mps-cli
      VITE_KEYCLOAK_CLIENT_SECRET: anfoYhY7PNxIhgEthcWdbq2P4XPJ90Aw
      VITE_TEST_MODE: false
    volumes:
      - ./app/front:/app  # Mount local files for live reloading
      - /app/node_modules  # Avoid overwriting node_modules
    command: ["npm", "run", "dev"]
    stdin_open: true
    tty: true

  flyway:
    build:
      context: ./app/back
      dockerfile: Dockerfile.flyway
    depends_on:
      appdb:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://appdb:${APP_DB_PORT}/${APP_DB_NAME}
      FLYWAY_USER: ${APP_DB_USER}
      FLYWAY_PASSWORD: ${APP_DB_PASSWORD}
