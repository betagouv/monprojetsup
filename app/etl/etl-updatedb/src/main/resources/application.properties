mps.data.ideo.od.metiers.simple.uri=https://api.opendata.onisep.fr/downloads/5fa5949243f97/5fa5949243f97.json
mps.data.ideo.od.metiers.fiches.uri=https://api.opendata.onisep.fr/downloads/5fe0808a2da6f/5fe0808a2da6f.zip
mps.data.ideo.od.domaines.uri=https://api.opendata.onisep.fr/downloads/5fa58d750a60c/5fa58d750a60c.json

mps.data.reference.table.expert=profil_reference_expert
