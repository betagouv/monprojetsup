spring.application.name=MonProjetSup
server.port=${SERVER_PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
flyway.url=${DB_URL}
flyway.user=${DB_USER}
flyway.password=${DB_PASSWORD}
flyway.enabled=true
flyway.baselineOnMigrate=true
suggestions.api.url=${SUGGESTIONS_API_URL}
cors.originPatterns=${CORS_ORIGINPATTERNS}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ROYAUME_URL}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ROYAUME_URL_JWT_VERIF}

springdoc.swagger-ui.oauth.client-id=${KEYCLOAK_CLIENT_ID}
springdoc.swagger-ui.oauth.client-secret=${KEYCLOAK_CLIENT_SECRET}

parcoursup.api.favoris.client.id=${PARCOURSUP_API_CLIENT_ID}
parcoursup.api.favoris.client.password=${PARCOURSUP_API_CLIENT_PASSWORD}
parcoursup.authent.url=${PARCOURSUP_URL_AUTHENT}
parcoursup.authent.client.id=${PARCOURSUP_AUTHENT_CLIENT_ID}
parcoursup.authent.client.password=${PARCOURSUP_AUTHENT_CLIENT_PASSWORD}
parcoursup.api.favoris.baseUrl=${PARCOURSUP_API_URL}
parcoursup.api.favoris.endpoint=ApiFavoris/favoris

pfa.api.enabled=${MPS_DATA_AVENIRS_API_USE_API:false}
pfa.api.baseUrl=${MPS_DATA_AVENIRS_API_BASEURL:}

pfa.api.auth.uri=${MPS_DATA_AVENIRS_API_ACCESS_TOKEN_URI}
pfa.api.auth.client.id=${MPS_DATA_AVENIRS_API_CLIENT_ID}
pfa.api.auth.client.secret=${MPS_DATA_AVENIRS_API_CLIENT_SECRET}

pfa.api.publication.endpoint=${MPS_DATA_AVENIRS_API_INDICATEURS_ELEVES_ENDPOINT}
pfa.api.publication.activite.id=${MPS_DATA_AVENIRS_API_INDICATEURS_ELEVES_ACTIVITE_ID}
pfa.api.publication.modalite.id=${MPS_DATA_AVENIRS_API_INDICATEURS_ELEVES_OUTIL_ID}
pfa.api.publication.eleve.id.debug=

management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus,health,metrics

logging.level.org.springframework.security=${LOG_LEVEL:INFO}
logging.level.org.springframework.security.web.FilterChainProxy=${LOG_LEVEL:INFO}
logging.level.org.springframework.security.web.authentication=${LOG_LEVEL:INFO}
logging.level.org.springframework.security.web.access=${LOG_LEVEL:INFO}

spring.config.import=optional:secrets.properties