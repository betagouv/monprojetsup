server.port=${SUGGESTIONS_SERVER_PORT:8004}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

frontUri=${FRONT_URI:http://localhost:8003}
allowed.origins=*

spring.application.name=MpsSuggestionsApp

springdoc.api-docs.path=/api-docs
springdoc.use-fqn=true

logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO

server.error.include-exception=true
server.error.include-stacktrace=always

spring.devtools.restart.enabled=false

swaggerUrl=${SUGGESTIONS_SWAGGER_URL:http://localhost:8004}

spring.jpa.hibernate.ddl-auto=none

mps.suggestions.dynamic_parameter_service.enabled=${ENABLE_DYNAMIC_PARAMETERS_SERVICE:false}
mps.generateDetailedExplanations=${GENERATE_DETAILED_EXPLANATIONS:false}
mps.suggestions2.url=${SUGGESTIONS2_URL:http://localhost:5445}
mps.suggestions2.enabled=${SUGGESTIONS2_ENABLED:false}

management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus,health,metrics

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=30000

spring.config.import=optional:secrets.properties



