services:
  app:
    container_name: monprojetsup-front-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:5001" # Change the port if needed
    environment:
      - NODE_ENV=development
      - VITE_ENV=local
      - VITE_APP_URL=http://localhost:5001
      - VITE_API_URL=http://localhost:5002
      - VITE_PUBLIC_WEBSITE_URL=https://www.monprojetsup.fr
      - VITE_AVENIRS_URL=https://avenirs.onisep.fr
      - VITE_MATOMO_URL=http://urldetrackingmatomo.org
      - VITE_KEYCLOAK_URL=http://localhost:5003
      - VITE_KEYCLOAK_ROYAUME="avenirs"
      - VITE_KEYCLOAK_CLIENT_ID="mps_cli"
      - VITE_KEYCLOAK_CLIENT_SECRET="secret"
      - VITE_TEST_MODE=true
    volumes:
      - .:/app  # Mount local files for live reloading
      - /app/node_modules  # Avoid overwriting node_modules
    command: ["npm", "run", "dev"]
    stdin_open: true
    tty: true
